spring:
  application:
    name: seckill-demo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seckill_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:seckill}
    password: ${DB_PASSWORD:seckill_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:seckill}
    password: ${RABBITMQ_PASSWORD:seckill_dev_password}
    # 发布确认：Broker 收到消息后回调生产者，能感知"消息到底到没到"
    publisher-confirm-type: correlated
    # 路由失败回调：消息发到交换机但没匹配到队列时退还生产者
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK：处理成功才确认，失败进死信队列
        acknowledge-mode: manual


#mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}

